name: Build & Package Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            npm_cmd: npm run dist:win
            artifact_pattern: dist-app/*.exe
            platform_desc: Windows Installer & Portable (.exe)
          - os: macos-latest
            npm_cmd: npm run dist:mac
            artifact_pattern: dist-app/*.dmg
            platform_desc: macOS DMG & App (.dmg)
          - os: ubuntu-latest
            npm_cmd: npm run dist:linux
            artifact_pattern: dist-app/*.AppImage
            platform_desc: Linux AppImage (.AppImage)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotify-bin python3-tk libgirepository1.0-dev libcairo2-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt || true
          python -m pip install pyinstaller pillow pystray uvicorn fastapi websockets paramiko cryptography

      - name: Install Node Dependencies
        run: |
          npm ci || npm install

      - name: Generate Application Icons
        run: |
          python scripts/generate_icons.py

      - name: Build Python Backend Binary
        run: |
          python package.py

      - name: Package Desktop Application with Electron Builder
        run: |
          ${{ matrix.npm_cmd }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitSentinel-${{ matrix.os }}
          path: ${{ matrix.artifact_pattern }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
